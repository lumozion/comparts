<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComParts - Computer Parts Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 400px; margin: 50px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        .title { font-size: 32px; font-weight: bold; color: #1976d2; margin-bottom: 10px; }
        .subtitle { font-size: 18px; color: #666; margin-bottom: 40px; }
        .button { background: #1976d2; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; transition: background 0.3s; }
        .button:hover { background: #1565c0; }
        .button.signup { background: #dc004e; }
        .button.signup:hover { background: #c2185b; }
        .note { margin-top: 30px; font-size: 12px; color: #999; }
        .features { text-align: left; margin-top: 30px; }
        .feature { margin: 10px 0; color: #555; }
        .feature::before { content: "✓ "; color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="title">ComParts</h1>
            <p class="subtitle">Computer Parts Store</p>
            
            <button class="button" onclick="showLogin()">Login</button>
            <button class="button signup" onclick="showSignup()">Sign Up</button>
            
            <div class="features">
                <div class="feature">Browse computer parts</div>
                <div class="feature">Secure payment processing</div>
                <div class="feature">Order tracking</div>
                <div class="feature">Product reviews</div>
                <div class="feature">Admin management panel</div>
            </div>
            
            <p class="note">
                Demo MVP - Connect Firebase to enable full functionality
            </p>
        </div>
    </div>

    <script>
        function showLogin() {
            alert('Login Screen\n\nThis would connect to Firebase Auth for user authentication.\n\nFeatures:\n• Email/Password login\n• Social login options\n• Password reset');
        }
        
        function showSignup() {
            alert('Signup Screen\n\nThis would create new user accounts via Firebase.\n\nFeatures:\n• User registration\n• Email verification\n• Profile creation');
        }
    </script>
</body>
</html>
